name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - agent/windows-wifi-diagnostics
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python -m pip install "pyinstaller>=6.0,<7.0"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name WifiTexnik
          wifi_technician.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WifiTexnik-Windows
          path: dist/WifiTexnik.exe
          if-no-files-found: error
